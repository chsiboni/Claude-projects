<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>נחש · NEON SERPENT</title>
<style>
  :root {
    --bg-deep: #07090f;
    --bg-panel: rgba(16, 20, 32, .72);
    --ink: #e8ecf6;
    --ink-soft: #8b93a8;
    --accent: #34f5c5;
    --accent-2: #7c5cff;
    --danger: #ff5c7a;
    --gold: #ffd166;
    --sans: "Heebo", system-ui, -apple-system, "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 20% -10%, #141c33 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, #1a1030 0%, transparent 55%),
      var(--bg-deep);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient floating orbs behind everything */
  .orb {
    position: fixed; border-radius: 50%; filter: blur(90px); opacity: .35;
    pointer-events: none; z-index: 0;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .orb.a { width: 420px; height: 420px; background: #123a3a; top: -12%; right: -8%; }
  .orb.b { width: 380px; height: 380px; background: #241a4d; bottom: -14%; left: -6%; animation-delay: -13s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.15); }
  }

  .stage {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 14px;
    width: min(94vw, 62dvh, 560px);
  }

  /* ---------- HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand {
    display: flex; flex-direction: column; line-height: 1.1;
  }
  .brand .t {
    font-size: clamp(20px, 4.5vw, 26px); font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .s { font-size: 11px; color: var(--ink-soft); letter-spacing: .32em; font-weight: 500; }

  .scores { display: flex; gap: 10px; }
  .pill {
    min-width: 86px; padding: 8px 14px; border-radius: 14px;
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px -12px rgba(0,0,0,.8);
    backdrop-filter: blur(10px);
    text-align: center;
  }
  .pill .label { font-size: 10px; color: var(--ink-soft); letter-spacing: .14em; font-weight: 600; }
  .pill .value { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .pill.best .value { color: var(--gold); }
  .pill .value.bump { animation: bump .28s ease; display: inline-block; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  /* ---------- BOARD ---------- */
  .frame {
    position: relative;
    border-radius: 22px;
    padding: 10px;
    background: linear-gradient(155deg, rgba(52,245,197,.35), rgba(124,92,255,.28) 45%, rgba(255,92,122,.18));
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 30px 80px -20px rgba(0,0,0,.85),
      0 0 90px -30px rgba(52,245,197,.45);
  }
  .frame-inner {
    border-radius: 14px; overflow: hidden;
    background: #0a0d16;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }
  canvas { display: block; width: 100%; aspect-ratio: 1; }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: absolute; inset: 10px; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: rgba(7, 9, 15, .62);
    backdrop-filter: blur(14px) saturate(1.2);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
    text-align: center; padding: 24px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0; font-size: clamp(30px, 7vw, 44px); font-weight: 900; letter-spacing: .01em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--danger));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 5s linear infinite;
  }
  @keyframes sheen { to { background-position: 200% 0; } }

  .overlay h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); font-weight: 900; }
  .overlay h2.dead { color: var(--danger); text-shadow: 0 0 30px rgba(255,92,122,.5); }
  .overlay p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 34ch; line-height: 1.7; }

  .final-score { font-family: var(--mono); font-size: clamp(40px, 10vw, 64px); font-weight: 800; line-height: 1; }
  .new-record {
    color: var(--gold); font-weight: 800; font-size: 14px; letter-spacing: .12em;
    animation: glowPulse 1.2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 8px rgba(255,209,102,.7); opacity: 1; }
    50% { text-shadow: 0 0 24px rgba(255,209,102,1); opacity: .85; }
  }

  .btn {
    margin-top: 14px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 16px; color: #061310;
    padding: 13px 38px; border: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #6ef7d8);
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset, 0 12px 40px -8px rgba(52,245,197,.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 0 1px rgba(255,255,255,.2) inset, 0 18px 50px -8px rgba(52,245,197,.75); }
  .btn:active { transform: translateY(0) scale(.98); }

  .hint { display: flex; gap: 14px; margin-top: 18px; color: var(--ink-soft); font-size: 12px; align-items: center; }
  kbd {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    border-bottom-width: 2px; border-radius: 6px; padding: 3px 7px;
  }

  .footer { display: flex; justify-content: space-between; align-items: center; color: var(--ink-soft); font-size: 11.5px; }
  .footer .mute { cursor: pointer; opacity: .8; } .footer .mute:hover { opacity: 1; }

  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    30%, 70% { transform: translate(4px, -2px); }
    50% { transform: translate(-5px, 2px); }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <div class="stage">
    <div class="hud">
      <div class="brand">
        <div class="t">נחש</div>
        <div class="s">NEON SERPENT</div>
      </div>
      <div class="scores">
        <div class="pill">
          <div class="label">ניקוד</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="pill best">
          <div class="label">שיא</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="frame" id="frame">
      <div class="frame-inner"><canvas id="game"></canvas></div>

      <div class="overlay show" id="startOverlay">
        <h1>NEON SERPENT</h1>
        <p>אספו את הפירות הזוהרים, אל תפגעו בקירות ואל תנשכו את הזנב. המהירות עולה ככל שגדלים.</p>
        <button class="btn" id="startBtn">שחקו עכשיו</button>
        <div class="hint"><span><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd><kbd>←</kbd> תנועה</span><span><kbd>רווח</kbd> השהיה</span><span>במובייל — החליקו</span></div>
      </div>

      <div class="overlay" id="pauseOverlay">
        <h2>מושהה</h2>
        <p>לחצו רווח או הקישו כדי להמשיך</p>
      </div>

      <div class="overlay" id="deadOverlay">
        <h2 class="dead">המשחק נגמר</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="new-record" id="newRecord" hidden>✦ שיא חדש ✦</div>
        <button class="btn" id="retryBtn">עוד פעם</button>
      </div>
    </div>

    <div class="footer">
      <span>Neon Serpent · Snake Classic</span>
      <span class="mute" id="muteBtn">🔊 סאונד</span>
    </div>
  </div>

<script>
"use strict";

/* ============================== setup ============================== */
const COLS = 21, ROWS = 21;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const frame = document.getElementById("frame");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

let cell = 24, W = 0, H = 0, dpr = 1;
function resize() {
  const size = canvas.clientWidth;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  W = H = size;
  cell = size / COLS;
}
new ResizeObserver(resize).observe(canvas);

/* ============================== audio ============================== */
let audioCtx = null, muted = false;
function beep(freq, dur = .08, type = "sine", gain = .12, slide = 0) {
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  eat()  { beep(520, .09, "sine", .14, 880); beep(1040, .12, "triangle", .06); },
  turn() { beep(240, .03, "square", .02); },
  die()  { beep(320, .35, "sawtooth", .12, 60); },
  start(){ beep(440, .1, "sine", .1, 660); beep(660, .14, "sine", .08, 990); },
};
document.getElementById("muteBtn").addEventListener("click", (e) => {
  muted = !muted;
  e.target.textContent = muted ? "🔇 מושתק" : "🔊 סאונד";
});

/* ============================== state ============================== */
const DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
let snake, dir, nextDirs, food, score, best, dead, paused, started;
let stepMs, lastStep, particles, foodPulse, eatFlash, hue;

best = +(localStorage.getItem("neon-serpent-best") || 0);
bestEl.textContent = best;

function reset() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [{x:cx+1,y:cy},{x:cx,y:cy},{x:cx-1,y:cy}].map(p => ({...p, px: p.x, py: p.y}));
  dir = DIRS.right;
  nextDirs = [];
  score = 0;
  stepMs = 170;
  dead = false; paused = false;
  particles = [];
  foodPulse = 0; eatFlash = 0; hue = 160;
  lastStep = performance.now();
  scoreEl.textContent = "0";
  placeFood();
}

function placeFood() {
  const free = [];
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
  food = free[Math.floor(Math.random() * free.length)];
}

/* ============================== input ============================== */
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};
function queueDir(name) {
  const d = DIRS[name];
  const last = nextDirs.length ? nextDirs[nextDirs.length - 1] : dir;
  if (d.x === -last.x && d.y === -last.y) return; // no reversing
  if (d === last) return;
  if (nextDirs.length < 3) { nextDirs.push(d); sfx.turn(); }
}

document.addEventListener("keydown", (e) => {
  if (KEYMAP[e.key]) {
    e.preventDefault();
    if (started && !dead && !paused) queueDir(KEYMAP[e.key]);
  } else if (e.key === " ") {
    e.preventDefault();
    if (!started) start();
    else if (dead) start();
    else togglePause();
  }
});

// swipe controls
let touchStart = null;
document.addEventListener("touchstart", (e) => { touchStart = e.touches[0]; }, {passive: true});
document.addEventListener("touchend", (e) => {
  if (!touchStart || !started || dead) { if (paused) togglePause(); return; }
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  touchStart = null;
  if (Math.hypot(dx, dy) < 24) { if (paused) togglePause(); return; }
  if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? "right" : "left");
  else queueDir(dy > 0 ? "down" : "up");
}, {passive: true});

/* ============================== overlays ============================== */
const startOverlay = document.getElementById("startOverlay");
const pauseOverlay = document.getElementById("pauseOverlay");
const deadOverlay = document.getElementById("deadOverlay");

function start() {
  reset();
  started = true;
  startOverlay.classList.remove("show");
  deadOverlay.classList.remove("show");
  sfx.start();
}
function togglePause() {
  if (!started || dead) return;
  paused = !paused;
  pauseOverlay.classList.toggle("show", paused);
  if (!paused) lastStep = performance.now();
}
document.getElementById("startBtn").addEventListener("click", start);
document.getElementById("retryBtn").addEventListener("click", start);
pauseOverlay.addEventListener("click", togglePause);
window.addEventListener("blur", () => { if (started && !dead && !paused) togglePause(); });

/* ============================== game logic ============================== */
function step() {
  if (nextDirs.length) dir = nextDirs.shift();

  const head = snake[0];
  const nx = head.x + dir.x, ny = head.y + dir.y;

  const hitWall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
  const hitSelf = snake.some((s, i) => i < snake.length - 1 && s.x === nx && s.y === ny);
  if (hitWall || hitSelf) return die();

  // record previous positions for interpolation
  for (const s of snake) { s.px = s.x; s.py = s.y; }

  const ate = nx === food.x && ny === food.y;
  if (!ate) snake.pop();
  snake.unshift({x: nx, y: ny, px: head.x, py: head.y});
  if (ate) {
    score++;
    scoreEl.textContent = score;
    scoreEl.classList.remove("bump"); void scoreEl.offsetWidth; scoreEl.classList.add("bump");
    stepMs = Math.max(70, 170 - score * 3.2);
    hue = (hue + 24) % 360;
    eatFlash = 1;
    burst(food.x, food.y);
    sfx.eat();
    placeFood();
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem("neon-serpent-best", best);
    }
  }
}

function die() {
  dead = true;
  sfx.die();
  frame.classList.remove("shake"); void frame.offsetWidth; frame.classList.add("shake");
  const head = snake[0];
  burst(head.x, head.y, 40, "255,92,122");
  document.getElementById("finalScore").textContent = score;
  const record = score === best && score > 0;
  document.getElementById("newRecord").hidden = !record;
  setTimeout(() => deadOverlay.classList.add("show"), 550);
}

/* ============================== particles ============================== */
function burst(gx, gy, n = 26, rgb = null) {
  const cx = (gx + .5) * cell, cy = (gy + .5) * cell;
  const color = rgb || `hsl(${hue}, 95%, 65%)`;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (Math.random() * .5 + .25) * cell * .32;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 1, decay: Math.random() * .025 + .015,
      r: Math.random() * cell * .14 + cell * .05,
      color: rgb ? `rgba(${rgb},` : null, hsl: rgb ? null : color,
    });
  }
}

/* ============================== render ============================== */
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  drawBoard(now);
  if (started) {
    const t = dead || paused ? 1 : Math.min(1, (now - lastStep) / stepMs);
    drawFood(now);
    drawSnake(t, now);
    drawParticles();
    if (eatFlash > 0) {
      ctx.fillStyle = `hsla(${hue}, 95%, 70%, ${eatFlash * .07})`;
      ctx.fillRect(0, 0, W, H);
      eatFlash -= .06;
    }
  } else {
    drawFood(now);
  }
  drawVignette();
}

function drawBoard(now) {
  // base
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#0b0f1c");
  g.addColorStop(1, "#0a0c14");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // subtle checker + grid lines
  ctx.fillStyle = "rgba(255,255,255,.012)";
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);

  ctx.strokeStyle = "rgba(120,140,200,.05)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < COLS; i++) { ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, H); }
  for (let i = 1; i < ROWS; i++) { ctx.moveTo(0, i * cell); ctx.lineTo(W, i * cell); }
  ctx.stroke();

  // breathing edge glow
  const breathe = .5 + Math.sin(now / 1600) * .5;
  ctx.strokeStyle = `rgba(52,245,197,${.05 + breathe * .06})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
}

function drawFood(now) {
  if (!food) return;
  foodPulse = .5 + Math.sin(now / 260) * .5;
  const x = (food.x + .5) * cell, y = (food.y + .5) * cell;
  const r = cell * (.26 + foodPulse * .05);

  // halo
  const halo = ctx.createRadialGradient(x, y, 0, x, y, cell * 1.4);
  halo.addColorStop(0, `hsla(${hue}, 95%, 65%, ${.30 + foodPulse * .15})`);
  halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y, cell * 1.4, 0, 7); ctx.fill();

  // orb
  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 95%, 65%)`;
  ctx.shadowBlur = 18 + foodPulse * 10;
  const orb = ctx.createRadialGradient(x - r*.35, y - r*.4, r*.1, x, y, r);
  orb.addColorStop(0, "#ffffff");
  orb.addColorStop(.35, `hsl(${hue}, 95%, 72%)`);
  orb.addColorStop(1, `hsl(${hue}, 90%, 45%)`);
  ctx.fillStyle = orb;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();

  // orbiting sparkle
  const oa = now / 500;
  ctx.fillStyle = `hsla(${hue}, 100%, 85%, .9)`;
  ctx.beginPath();
  ctx.arc(x + Math.cos(oa) * r * 1.8, y + Math.sin(oa) * r * 1.8, cell * .045, 0, 7);
  ctx.fill();
}

function lerp(a, b, t) { return a + (b - a) * t; }

function drawSnake(t, now) {
  const pts = snake.map(s => ({
    x: (lerp(s.px, s.x, t) + .5) * cell,
    y: (lerp(s.py, s.y, t) + .5) * cell,
  }));

  const headR = cell * .42, tailR = cell * .16;
  const n = pts.length;

  // glow underlay
  ctx.save();
  ctx.shadowColor = `hsla(${hue}, 95%, 60%, .9)`;
  ctx.shadowBlur = 22;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // body: tapered strokes segment by segment, tail → head
  for (let i = n - 1; i > 0; i--) {
    const k = 1 - i / (n - 1); // 0 tail → 1 head
    const w = (tailR + (headR - tailR) * (k * k * .4 + k * .6)) * 2;
    const light = 42 + k * 22;
    ctx.strokeStyle = `hsl(${(hue + (1 - k) * 40) % 360}, 85%, ${light}%)`;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i-1].x, pts[i-1].y);
    ctx.stroke();
  }
  ctx.restore();

  // scale shine along the spine
  ctx.fillStyle = "rgba(255,255,255,.18)";
  for (let i = 2; i < n; i += 2) {
    const k = 1 - i / (n - 1);
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, (tailR + (headR - tailR) * k) * .34, 0, 7);
    ctx.fill();
  }

  // head
  const hp = pts[0];
  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 95%, 70%)`;
  ctx.shadowBlur = 26;
  const hg = ctx.createRadialGradient(hp.x - headR*.3, hp.y - headR*.3, headR*.15, hp.x, hp.y, headR);
  hg.addColorStop(0, `hsl(${hue}, 90%, 78%)`);
  hg.addColorStop(1, `hsl(${hue}, 85%, 50%)`);
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(hp.x, hp.y, headR, 0, 7); ctx.fill();
  ctx.restore();

  // eyes track movement direction
  const ex = dir.x, ey = dir.y;
  const perpX = -ey, perpY = ex;
  const eyeOff = headR * .42, eyeFwd = headR * .3;
  const blink = (Math.sin(now / 900) > .97) ? .15 : 1;
  for (const side of [-1, 1]) {
    const cx = hp.x + ex * eyeFwd + perpX * eyeOff * side;
    const cy = hp.y + ey * eyeFwd + perpY * eyeOff * side;
    ctx.fillStyle = "#0a0f18";
    ctx.beginPath();
    ctx.ellipse(cx, cy, headR * .22, headR * .22 * blink, 0, 0, 7);
    ctx.fill();
    if (blink === 1) {
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(cx + ex * headR * .07 + headR * .05, cy + ey * headR * .07 - headR * .05, headR * .07, 0, 7);
      ctx.fill();
    }
  }
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= .92; p.vy *= .92; p.vy += cell * .006;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color ? `${p.color}${p.life})` : p.hsl;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, W * .38, W/2, H/2, W * .75);
  v.addColorStop(0, "transparent");
  v.addColorStop(1, "rgba(0,0,0,.42)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== main loop ============================== */
function loop(now) {
  if (started && !dead && !paused) {
    while (now - lastStep >= stepMs) {
      lastStep += stepMs;
      step();
      if (dead) break;
    }
  }
  draw(now);
  requestAnimationFrame(loop);
}

reset();
started = false;
resize();
requestAnimationFrame(loop);
</script>
</body>
