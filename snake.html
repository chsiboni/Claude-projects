<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON SERPENT — סנייק</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&display=swap');

  :root {
    --bg-0: #07090f;
    --bg-1: #0c1018;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e8edf5;
    --text-dim: #7d8799;
    --accent: #35e08c;
    --accent-2: #21c7a8;
    --gold: #ffd166;
    --danger: #ff5d73;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    font-family: 'Heebo', system-ui, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(53, 224, 140, 0.07), transparent 60%),
      radial-gradient(ellipse 70% 55% at 85% 110%, rgba(33, 150, 199, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 10% 100%, rgba(140, 80, 255, 0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* faint animated star dust */
  body::after {
    content: '';
    position: fixed;
    inset: -50%;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.25), transparent 100%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.18), transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,.22), transparent 100%),
      radial-gradient(1px 1px at 35% 80%, rgba(255,255,255,.15), transparent 100%),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.2), transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 15%, rgba(255,255,255,.14), transparent 100%);
    animation: drift 90s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(0, 0, 0) rotate(360deg); }
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    align-items: stretch;
    gap: 10px;
    width: min(92vw, 560px);
  }

  .hud-card {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 8px 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .hud-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  #score-value { color: var(--accent); text-shadow: 0 0 18px rgba(53, 224, 140, 0.5); }
  #best-value  { color: var(--gold);   text-shadow: 0 0 18px rgba(255, 209, 102, 0.4); }
  #level-value { color: #6ec6ff;       text-shadow: 0 0 18px rgba(110, 198, 255, 0.4); }

  .hud-value.bump { animation: bump 0.35s cubic-bezier(.2,2.2,.4,1); }
  @keyframes bump { 50% { transform: scale(1.35); } }

  /* ---------- Board ---------- */
  #board-wrap {
    position: relative;
    border-radius: 22px;
    padding: 10px;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 40%, rgba(255,255,255,0.04));
    border: 1px solid var(--panel-border);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 60px rgba(53, 224, 140, 0.06);
  }

  canvas {
    display: block;
    border-radius: 14px;
    background: var(--bg-1);
  }

  #board-wrap.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(3px, -2px); }
    30%, 50%, 70% { transform: translate(-5px, 2px); }
    40%, 60% { transform: translate(4px, -1px); }
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    background: rgba(7, 9, 15, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
    padding: 24px;
  }

  .overlay.visible { opacity: 1; pointer-events: auto; }

  .game-title {
    font-size: clamp(34px, 7vw, 52px);
    font-weight: 900;
    letter-spacing: 0.04em;
    background: linear-gradient(120deg, #8affc1, var(--accent) 35%, var(--accent-2) 70%, #35b6e0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(53, 224, 140, 0.35));
  }

  .game-subtitle {
    color: var(--text-dim);
    font-weight: 300;
    font-size: 15px;
    max-width: 34ch;
    line-height: 1.7;
  }

  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #04120b;
    background: linear-gradient(120deg, #8affc1, var(--accent) 45%, var(--accent-2));
    border: none;
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(53, 224, 140, 0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.18s cubic-bezier(.2,1.6,.4,1), box-shadow 0.18s ease;
  }

  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 16px 40px rgba(53, 224, 140, 0.5), inset 0 1px 0 rgba(255,255,255,0.5); }
  .btn:active { transform: translateY(0) scale(0.97); }

  .keys-hint {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  kbd {
    font-family: inherit;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-bottom-width: 2px;
    border-radius: 7px;
    padding: 3px 9px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  #final-score {
    font-size: clamp(48px, 10vw, 72px);
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(53, 224, 140, 0.55);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #gameover-title {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 900;
    color: var(--danger);
    text-shadow: 0 0 30px rgba(255, 93, 115, 0.45);
  }

  #new-record {
    display: none;
    color: var(--gold);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.6);
    animation: pulse-gold 1.2s ease-in-out infinite;
  }

  @keyframes pulse-gold { 50% { opacity: 0.55; transform: scale(0.96); } }

  #pause-overlay .game-title { font-size: clamp(28px, 6vw, 40px); }

  #footer {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  @media (max-width: 640px) {
    .hud-value { font-size: 19px; }
    .keys-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-card">
      <span class="hud-label">ניקוד</span>
      <span class="hud-value" id="score-value">0</span>
    </div>
    <div class="hud-card">
      <span class="hud-label">שיא</span>
      <span class="hud-value" id="best-value">0</span>
    </div>
    <div class="hud-card">
      <span class="hud-label">שלב</span>
      <span class="hud-value" id="level-value">1</span>
    </div>
  </div>

  <div id="board-wrap">
    <canvas id="game"></canvas>

    <div class="overlay visible" id="start-overlay">
      <div class="game-title">NEON SERPENT</div>
      <div class="game-subtitle">סנייק כמו של פעם — בגרסה שמרגישה כמו משחק ארקייד מודרני. אספו פירות זוהרים, אל תיגעו בזנב.</div>
      <button class="btn" id="start-btn">שחקו עכשיו</button>
      <div class="keys-hint"><kbd>↑ ↓ → ←</kbd> תנועה &nbsp;·&nbsp; <kbd>רווח</kbd> השהיה</div>
    </div>

    <div class="overlay" id="gameover-overlay">
      <div id="gameover-title">המשחק נגמר</div>
      <div id="final-score">0</div>
      <div id="new-record">✦ שיא חדש ✦</div>
      <button class="btn" id="restart-btn">עוד סיבוב</button>
    </div>

    <div class="overlay" id="pause-overlay">
      <div class="game-title">הפסקה</div>
      <div class="keys-hint"><kbd>רווח</kbd> להמשך</div>
    </div>
  </div>

  <div id="footer">במובייל: החליקו על המסך כדי לשנות כיוון</div>
</div>

<script>
(() => {
  'use strict';

  /* ============================== Setup ============================== */

  const COLS = 21, ROWS = 21;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const boardWrap = document.getElementById('board-wrap');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let CELL = 26;

  function resize() {
    const margin = 220;
    const size = Math.min(
      window.innerWidth - 52,
      window.innerHeight - margin,
      560
    );
    CELL = Math.max(14, Math.floor(size / COLS));
    const px = CELL * COLS;
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================== Audio ============================== */

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, dur, type, vol, delay = 0, slideTo = null) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  const sfx = {
    eat()   { tone(520, 0.12, 'sine', 0.22, 0, 880); tone(1040, 0.1, 'sine', 0.1, 0.04); },
    gold()  { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0.14, 'triangle', 0.16, i * 0.06)); },
    level() { tone(440, 0.16, 'triangle', 0.18, 0, 660); tone(660, 0.2, 'triangle', 0.14, 0.1, 880); },
    die()   { tone(300, 0.5, 'sawtooth', 0.18, 0, 60); tone(180, 0.6, 'square', 0.08, 0.08, 40); },
    start() { tone(330, 0.1, 'sine', 0.15); tone(495, 0.1, 'sine', 0.15, 0.09); tone(660, 0.16, 'sine', 0.18, 0.18); },
  };

  /* ============================== State ============================== */

  const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, DEAD: 3 };

  let state = STATE.MENU;
  let snake, dir, dirQueue, food, goldFood, goldTimer;
  let score, best, bestAtStart, level, speed;
  let stepAccum, lastTime, deathAnim;
  let particles = [], floaters = [], eatPulse = 0, appleAngle = 0;
  let time = 0, deathTimeout = null;
  let trail = [], visualLen = 0;

  best = +(localStorage.getItem('neon-serpent-best') || 0);
  document.getElementById('best-value').textContent = best;

  const BASE_STEP = 160;      // ms per cell at level 1
  const MIN_STEP = 62;
  const POINTS_PER_LEVEL = 50;

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 4; i++) snake.push({ x: cx - i, y: cy, px: cx - i, py: cy });
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0; level = 1;
    bestAtStart = best;
    speed = BASE_STEP;
    stepAccum = 0;
    goldFood = null; goldTimer = 0;
    particles = []; floaters = [];
    deathAnim = 0;
    rebuildTrail();
    placeFood();
    updateHud();
  }

  function freeCell() {
    while (true) {
      const p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
      if (!snake.some(s => s.x === p.x && s.y === p.y) &&
          !(food && food.x === p.x && food.y === p.y) &&
          !(goldFood && goldFood.x === p.x && goldFood.y === p.y)) return p;
    }
  }

  function placeFood() { food = freeCell(); }

  function updateHud(bumpScore = false) {
    const sv = document.getElementById('score-value');
    sv.textContent = score;
    document.getElementById('best-value').textContent = best;
    document.getElementById('level-value').textContent = level;
    if (bumpScore) {
      sv.classList.remove('bump');
      void sv.offsetWidth;
      sv.classList.add('bump');
    }
  }

  /* ============================== Particles ============================== */

  function burst(x, y, color, n = 18, power = 3.2) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random() * 0.6) * power;
      particles.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        size: 1.5 + Math.random() * 2.5,
        color,
      });
    }
  }

  function floater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 1 });
  }

  /* ============================== Game logic ============================== */

  function setDir(nx, ny) {
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (last.x === nx && last.y === ny) return;
    if (last.x === -nx && last.y === -ny) return;
    if (dirQueue.length < 3) dirQueue.push({ x: nx, y: ny });
  }

  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // walls and self are both fatal — classic rules
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS ||
        snake.some((s, i) => i < snake.length - 1 && s.x === nx && s.y === ny)) {
      die();
      return;
    }

    for (const s of snake) { s.px = s.x; s.py = s.y; }

    let grew = false;

    if (food.x === nx && food.y === ny) {
      grew = true;
      score += 10;
      eatPulse = 1;
      sfx.eat();
      burst((nx + 0.5) * CELL, (ny + 0.5) * CELL, '#35e08c');
      floater((nx + 0.5) * CELL, ny * CELL, '+10', '#8affc1');
      placeFood();
      // occasionally spawn a golden bonus fruit
      if (!goldFood && Math.random() < 0.22) {
        goldFood = freeCell();
        goldTimer = 6000;
      }
    } else if (goldFood && goldFood.x === nx && goldFood.y === ny) {
      grew = true;
      score += 50;
      eatPulse = 1;
      sfx.gold();
      burst((nx + 0.5) * CELL, (ny + 0.5) * CELL, '#ffd166', 30, 4);
      floater((nx + 0.5) * CELL, ny * CELL, '+50', '#ffd166');
      goldFood = null;
    }

    const tail = snake[snake.length - 1];
    snake.unshift({ x: nx, y: ny, px: head.x, py: head.y });
    if (!grew) snake.pop();
    else snake[snake.length - 1] = { ...tail, px: tail.x, py: tail.y };

    if (grew) {
      const newLevel = 1 + Math.floor(score / POINTS_PER_LEVEL);
      if (newLevel > level) {
        level = newLevel;
        speed = Math.max(MIN_STEP, BASE_STEP - (level - 1) * 12);
        sfx.level();
        floater(canvas.clientWidth / 2, canvas.clientHeight / 2, 'שלב ' + level, '#6ec6ff');
      }
      if (score > best) {
        best = score;
        localStorage.setItem('neon-serpent-best', best);
      }
      updateHud(true);
    }
  }

  function die() {
    state = STATE.DEAD;
    deathAnim = 1;
    sfx.die();
    boardWrap.classList.remove('shake');
    void boardWrap.offsetWidth;
    boardWrap.classList.add('shake');
    const head = snake[0];
    burst((head.x + 0.5) * CELL, (head.y + 0.5) * CELL, '#ff5d73', 40, 5);

    const isRecord = score > 0 && score > bestAtStart;
    deathTimeout = setTimeout(() => {
      document.getElementById('final-score').textContent = score;
      document.getElementById('new-record').style.display = isRecord ? 'block' : 'none';
      document.getElementById('gameover-overlay').classList.add('visible');
    }, 650);
  }

  /* ============================== Rendering ============================== */

  function cellCenter(gx, gy) { return { x: (gx + 0.5) * CELL, y: (gy + 0.5) * CELL }; }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawBoard() {
    const w = CELL * COLS, h = CELL * ROWS;

    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#0b0f18');
    bg.addColorStop(0.5, '#0c1220');
    bg.addColorStop(1, '#0a0e16');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // checkerboard whisper
    ctx.fillStyle = 'rgba(255,255,255,0.012)';
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // grid lines
    ctx.strokeStyle = 'rgba(120, 150, 200, 0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, h); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(w, y * CELL + 0.5); }
    ctx.stroke();

    // vignette
    const vg = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);
  }

  function drawFood(t) {
    if (!food) return;
    const { x, y } = cellCenter(food.x, food.y);
    const pulse = 1 + Math.sin(time * 0.005) * 0.08 + eatPulse * 0.3;
    const r = CELL * 0.32 * pulse;

    appleAngle = Math.sin(time * 0.002) * 0.15;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(appleAngle);

    // outer glow
    const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 3);
    glow.addColorStop(0, 'rgba(53, 224, 140, 0.35)');
    glow.addColorStop(1, 'rgba(53, 224, 140, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // body
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r * 1.15);
    body.addColorStop(0, '#b8ffdb');
    body.addColorStop(0.35, '#4ef0a3');
    body.addColorStop(1, '#0f9e5e');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // leaf
    ctx.fillStyle = '#2fb56e';
    ctx.beginPath();
    ctx.ellipse(r * 0.25, -r * 1.15, r * 0.42, r * 0.2, -0.7, 0, Math.PI * 2);
    ctx.fill();

    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.32, -r * 0.35, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawGoldFood() {
    if (!goldFood) return;
    const { x, y } = cellCenter(goldFood.x, goldFood.y);
    const frac = goldTimer / 6000;
    const blink = frac < 0.25 ? (Math.sin(time * 0.02) > 0 ? 1 : 0.25) : 1;
    const pulse = 1 + Math.sin(time * 0.008) * 0.12;
    const r = CELL * 0.34 * pulse;

    ctx.save();
    ctx.globalAlpha = blink;
    ctx.translate(x, y);
    ctx.rotate(time * 0.0015);

    const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 3.2);
    glow.addColorStop(0, 'rgba(255, 209, 102, 0.5)');
    glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 3.2, 0, Math.PI * 2);
    ctx.fill();

    // star
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // timer ring
    ctx.rotate(-time * 0.0015);
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();

    ctx.restore();
  }

  /* ---- continuous body path -------------------------------------------
     The grid drives the rules; the drawing follows a running trail of the
     head's real pixel positions. Body length is an arc length along that
     trail, so growth and turns read as one flowing motion instead of a
     chain of cells snapping into place. */

  function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

  function trailStep() { return Math.max(1.2, CELL * 0.11); }

  function bodyLength() { return Math.max(CELL, (snake.length - 0.55) * CELL); }

  function rebuildTrail() {
    trail = [];
    if (!snake || !snake.length) { visualLen = 0; return; }
    const gap = trailStep();
    for (let i = 0; i < snake.length - 1; i++) {
      const a = cellCenter(snake[i].x, snake[i].y);
      const b = cellCenter(snake[i + 1].x, snake[i + 1].y);
      const n = Math.max(1, Math.round(dist(a, b) / gap));
      for (let k = 0; k < n; k++) trail.push({ x: lerp(a.x, b.x, k / n), y: lerp(a.y, b.y, k / n) });
    }
    const tail = snake[snake.length - 1];
    trail.push(cellCenter(tail.x, tail.y));
    visualLen = bodyLength();
  }

  function updateTrail(t, dt) {
    if (!snake || !snake.length) return;

    const h = snake[0];
    const hx = (lerp(h.px, h.x, t) + 0.5) * CELL;
    const hy = (lerp(h.py, h.y, t) + 0.5) * CELL;
    const gap = trailStep();

    if (trail.length < 2) {
      trail.unshift({ x: hx, y: hy });
    } else if (dist(trail[1], { x: hx, y: hy }) >= gap) {
      trail.unshift({ x: hx, y: hy });
    } else {
      trail[0].x = hx;
      trail[0].y = hy;
    }

    // Ease toward the new length over roughly one step so the tail slows to
    // a stop as the snake grows, rather than jumping backwards on the bite.
    const target = bodyLength();
    const tau = Math.max(60, speed * 0.6);
    visualLen += (target - visualLen) * (1 - Math.exp(-dt / tau));

    // Keep a little history past the visible tail, then drop the rest.
    const keep = target + CELL * 3;
    let acc = 0;
    for (let i = 1; i < trail.length; i++) {
      acc += dist(trail[i - 1], trail[i]);
      if (acc > keep) { trail.length = i + 1; break; }
    }
  }

  // Walk the trail and return the path covering exactly `len` pixels.
  function sampleTrail(len) {
    if (trail.length < 2) return trail.slice();
    const out = [trail[0]];
    let acc = 0;
    for (let i = 1; i < trail.length; i++) {
      const d = dist(trail[i - 1], trail[i]);
      if (acc + d >= len) {
        const f = d > 0 ? (len - acc) / d : 0;
        out.push({ x: lerp(trail[i - 1].x, trail[i].x, f), y: lerp(trail[i - 1].y, trail[i].y, f) });
        return out;
      }
      acc += d;
      out.push(trail[i]);
    }
    return out;
  }

  function resample(pts, spacing) {
    if (pts.length < 2) return pts.slice();
    const out = [pts[0]];
    let ax = pts[0].x, ay = pts[0].y, acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let d = Math.hypot(pts[i].x - ax, pts[i].y - ay);
      while (acc + d >= spacing) {
        const f = (spacing - acc) / d;
        ax = lerp(ax, pts[i].x, f);
        ay = lerp(ay, pts[i].y, f);
        out.push({ x: ax, y: ay });
        acc = 0;
        d = Math.hypot(pts[i].x - ax, pts[i].y - ay);
      }
      acc += d;
      ax = pts[i].x; ay = pts[i].y;
    }
    const end = pts[pts.length - 1];
    if (dist(out[out.length - 1], end) > spacing * 0.35) out.push(end);
    return out;
  }

  // Rounds the 90° grid corners into arcs. The head stays pinned so the
  // drawing never drifts away from the cell the rules are using.
  function smoothPts(pts, passes) {
    let cur = pts;
    for (let p = 0; p < passes && cur.length > 2; p++) {
      const next = [cur[0]];
      for (let i = 1; i < cur.length - 1; i++) {
        next.push({
          x: cur[i - 1].x * 0.25 + cur[i].x * 0.5 + cur[i + 1].x * 0.25,
          y: cur[i - 1].y * 0.25 + cur[i].y * 0.5 + cur[i + 1].y * 0.25,
        });
      }
      next.push(cur[cur.length - 1]);
      cur = next;
    }
    return cur;
  }

  // 0 at the head, 1 at the tail tip: a slight swell behind the head, then a
  // long taper to a point.
  function widthProfile(u) {
    const neck = Math.min(1, u / 0.14);
    return (0.84 + 0.16 * neck) * Math.pow(1 - u, 0.5);
  }

  function ribbonPath(pts, bodyW) {
    const n = pts.length;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(n - 1, i + 1)];
      let tx = next.x - prev.x, ty = next.y - prev.y;
      const m = Math.hypot(tx, ty) || 1;
      tx /= m; ty /= m;
      const hw = bodyW * widthProfile(n > 1 ? i / (n - 1) : 0) * 0.5;
      L.push({ x: pts[i].x - ty * hw, y: pts[i].y + tx * hw });
      R.push({ x: pts[i].x + ty * hw, y: pts[i].y - tx * hw });
    }

    ctx.beginPath();
    ctx.moveTo(L[0].x, L[0].y);
    for (let i = 1; i < n - 1; i++) {
      ctx.quadraticCurveTo(L[i].x, L[i].y, (L[i].x + L[i + 1].x) / 2, (L[i].y + L[i + 1].y) / 2);
    }
    ctx.lineTo(L[n - 1].x, L[n - 1].y);
    ctx.lineTo(R[n - 1].x, R[n - 1].y);
    for (let i = n - 2; i >= 1; i--) {
      ctx.quadraticCurveTo(R[i].x, R[i].y, (R[i].x + R[i - 1].x) / 2, (R[i].y + R[i - 1].y) / 2);
    }
    ctx.lineTo(R[0].x, R[0].y);
    ctx.closePath();
  }

  function drawSnake() {
    if (!snake || snake.length < 2 || trail.length < 2) return;

    const raw = sampleTrail(visualLen);
    if (raw.length < 2) return;
    const pts = smoothPts(resample(raw, Math.max(4, CELL * 0.42)), 2);
    if (pts.length < 2) return;

    const dying = state === STATE.DEAD;
    const bodyW = Math.max(6, CELL * 0.78);
    const tail = pts[pts.length - 1];

    ctx.save();
    ctx.globalAlpha = dying ? Math.max(0.25, deathAnim) : 1;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, tail.x, tail.y);
    if (dying) {
      grad.addColorStop(0, '#ff8296');
      grad.addColorStop(1, '#7a2333');
    } else {
      grad.addColorStop(0, '#9dffcf');
      grad.addColorStop(0.35, '#35e08c');
      grad.addColorStop(1, '#0f8f66');
    }

    ribbonPath(pts, bodyW);

    // glow, then the body itself over the top
    ctx.shadowColor = dying ? 'rgba(255, 93, 115, 0.55)' : 'rgba(53, 224, 140, 0.5)';
    ctx.shadowBlur = Math.max(6, CELL * 0.7);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fill();

    // belly highlight running along the spine
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = bodyW * 0.3;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
    }
    ctx.stroke();

    // scales, with a shimmer travelling down the body
    for (let i = 2; i < pts.length - 2; i += 2) {
      const u = i / (pts.length - 1);
      const shimmer = 0.07 + 0.13 * Math.max(0, Math.sin(time * 0.004 - u * 6));
      ctx.fillStyle = 'rgba(255,255,255,' + shimmer.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, Math.max(1, bodyW * 0.085 * (1 - u * 0.6)), 0, Math.PI * 2);
      ctx.fill();
    }

    drawHead(pts, bodyW, dying);
    ctx.restore();
  }

  function drawHead(pts, bodyW, dying) {
    const head = pts[0];
    // Look far enough back for a stable heading; the smoothed path makes the
    // head swing through corners instead of snapping to the new axis.
    let neck = pts[pts.length - 1];
    for (let i = 1; i < pts.length; i++) {
      if (dist(pts[i], head) >= CELL * 0.34) { neck = pts[i]; break; }
    }
    const ang = Math.atan2(head.y - neck.y, head.x - neck.x);
    const r = bodyW * 0.56;

    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(ang);

    // head shape
    const hg = ctx.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.2, 0, 0, r * 1.4);
    if (dying) { hg.addColorStop(0, '#ffa9b8'); hg.addColorStop(1, '#c2314a'); }
    else { hg.addColorStop(0, '#a5ffd0'); hg.addColorStop(1, '#1db874'); }
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(r * 0.15, 0, r * 1.15, r * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    const eyeX = r * 0.35, eyeY = r * 0.48, eyeR = Math.max(1.6, r * 0.3);
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eyeX, eyeY * side, eyeR, 0, Math.PI * 2);
      ctx.fill();
      if (dying) {
        // X eyes
        ctx.strokeStyle = '#3a0a14';
        ctx.lineWidth = Math.max(1.2, eyeR * 0.35);
        const d = eyeR * 0.55;
        ctx.beginPath();
        ctx.moveTo(eyeX - d, eyeY * side - d); ctx.lineTo(eyeX + d, eyeY * side + d);
        ctx.moveTo(eyeX + d, eyeY * side - d); ctx.lineTo(eyeX - d, eyeY * side + d);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#0a1f14';
        ctx.beginPath();
        ctx.arc(eyeX + eyeR * 0.3, eyeY * side, eyeR * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(eyeX + eyeR * 0.05, eyeY * side - eyeR * 0.25, eyeR * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // flicking tongue
    if (!dying && Math.sin(time * 0.006) > 0.65) {
      ctx.strokeStyle = '#ff5d73';
      ctx.lineWidth = Math.max(1.2, r * 0.14);
      ctx.lineCap = 'round';
      const tx = r * 1.25, fork = r * 0.35;
      ctx.beginPath();
      ctx.moveTo(r * 0.9, 0);
      ctx.lineTo(tx + fork * 0.6, 0);
      ctx.moveTo(tx + fork * 0.6, 0);
      ctx.lineTo(tx + fork, -fork * 0.5);
      ctx.moveTo(tx + fork * 0.6, 0);
      ctx.lineTo(tx + fork, fork * 0.5);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vy += 0.002 * dt;
      p.vx *= 0.995;
      p.life -= p.decay * dt * 0.06;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters(dt) {
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.max(13, CELL * 0.6) + 'px Heebo, sans-serif';
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= dt * 0.03;
      f.life -= dt * 0.0012;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  /* ============================== Main loop ============================== */

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;
    time = now;

    if (state === STATE.PLAYING) {
      stepAccum += dt;
      while (stepAccum >= speed) {
        stepAccum -= speed;
        step();
        if (state !== STATE.PLAYING) { stepAccum = 0; break; }
      }
      if (goldFood) {
        goldTimer -= dt;
        if (goldTimer <= 0) goldFood = null;
      }
    }

    if (state === STATE.DEAD && deathAnim > 0) deathAnim = Math.max(0, deathAnim - dt * 0.0012);
    if (eatPulse > 0) eatPulse = Math.max(0, eatPulse - dt * 0.004);

    if (state === STATE.PLAYING) updateTrail(Math.min(1, stepAccum / speed), dt);

    drawBoard();
    drawFood();
    drawGoldFood();
    drawSnake();
    drawParticles(dt);
    drawFloaters(dt);
  }

  requestAnimationFrame(frame);

  // The trail is stored in pixels, so a new cell size invalidates it.
  window.addEventListener('resize', () => { if (snake) rebuildTrail(); });

  /* ============================== Controls ============================== */

  function startGame() {
    ensureAudio();
    clearTimeout(deathTimeout);
    reset();
    state = STATE.PLAYING;
    sfx.start();
    document.getElementById('start-overlay').classList.remove('visible');
    document.getElementById('gameover-overlay').classList.remove('visible');
    document.getElementById('pause-overlay').classList.remove('visible');
  }

  function togglePause() {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      document.getElementById('pause-overlay').classList.add('visible');
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      lastTime = 0;
      document.getElementById('pause-overlay').classList.remove('visible');
    }
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();

    if (k === ' ' || k === 'Escape') {
      if (state === STATE.MENU || state === STATE.DEAD) { if (k === ' ') startGame(); }
      else togglePause();
      return;
    }
    if (state === STATE.MENU) {
      if (k.startsWith('Arrow') || 'wasdWASD'.includes(k)) startGame();
    }
    if (state !== STATE.PLAYING) return;

    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
  });

  // touch: swipe anywhere on the board
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touchStart || state !== STATE.PLAYING) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === STATE.PLAYING) togglePause();
  });
})();
</script>
</body>
</html>
